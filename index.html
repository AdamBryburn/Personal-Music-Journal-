<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111116"><link rel="manifest" href="manifest.webmanifest"><title>Album Journal</title>
<style>
:root{color-scheme:dark;--bg:#111116;--panel:#20202a;--line:#393946;--text:#f7f4fc;--muted:#aaa6b6;--accent:#cba9ff}*{box-sizing:border-box}body{margin:0;padding:20px 15px;background:var(--bg);color:var(--text);font:16px system-ui;max-width:850px;margin:auto}header,.head{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:26px;margin:0}p,#hint,.artist,.small{color:var(--muted);font-size:13px}button,input,textarea,select{font:inherit}button{border:0;border-radius:12px;background:var(--accent);color:#21162d;font-weight:700;padding:11px 14px}input,textarea,select{background:#17171e;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:12px;width:100%}.search{display:flex;gap:8px;margin:18px 0 8px}.search input{min-width:0}.results,.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:15px 0}.result{display:flex;align-items:center;gap:9px;background:var(--panel);color:var(--text);text-align:left;border:1px solid var(--line);padding:8px}.result img{width:64px;height:64px;object-fit:cover;border-radius:7px}.result strong{font-size:13px;display:block}.result span{font-size:11px;color:var(--muted);display:block;margin-top:4px}.album{min-width:0}.cover{aspect-ratio:1;background:var(--panel);border-radius:9px;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.albumtitle{font-size:13px;font-weight:700;margin-top:6px;overflow-wrap:anywhere}.artist{margin-top:3px}.rating{color:#f5ce75;font-size:12px}.head{margin-top:22px}.filters{display:flex;gap:6px;margin:10px 0}.filters button{font-size:12px;padding:8px;background:var(--panel);color:var(--text)}.filters .active{background:var(--accent);color:#21162d}.empty{grid-column:1/-1;padding:25px;text-align:center;color:var(--muted);background:var(--panel);border-radius:14px;line-height:1.5}dialog{width:calc(100% - 20px);max-width:500px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px}dialog::backdrop{background:#000b}.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.buttons{display:flex;gap:8px}.buttons button{flex:1}.secondary{background:#33333e;color:white}.coverpreview{width:82px;height:82px;object-fit:cover;border-radius:8px}.foot{text-align:center;color:var(--muted);font-size:11px;margin:30px 0}@media(min-width:600px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.results{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body>
<header><div><h1>Album Journal</h1><p>Your music, your little corner.</p></div><button id="manual">＋ Add</button></header>
<div class="search"><input id="q" placeholder="Search an album or artist…"><button id="find">Find</button></div><div id="hint">Find an album to automatically bring in its cover art.</div><div id="results" class="results"></div>
<div class="head"><h2>My albums</h2><span id="count" class="small">0 albums</span></div><div class="filters"><button class="active" data-filter="all">All</button><button data-filter="favorites">♥ Favorites</button><button data-filter="recent">Recently added</button></div><div id="albums" class="grid"></div><div class="foot">Your journal is stored in this browser on this device.</div>
<dialog id="dlg"><form id="form"><div class="head"><h2 id="dlgtitle">Add album</h2><button type="button" class="secondary" id="close">✕</button></div><p><img id="preview" class="coverpreview" alt=""><br><strong id="pTitle"></strong><br><span id="pArtist" class="small"></span></p>
<div class="field"><label>Album</label><input id="title" required></div><div class="field"><label>Artist</label><input id="artist" required></div><div class="field"><label>Rating</label><select id="rating"><option value="0">Not rated</option><option value="1">½ star</option><option value="2">★</option><option value="3">★½</option><option value="4">★★</option><option value="5">★★½</option><option value="6">★★★</option><option value="7">★★★½</option><option value="8">★★★★</option><option value="9">★★★★½</option><option value="10">★★★★★</option></select></div><div class="field"><label>Date listened</label><input id="date" type="date"></div><div class="field"><label><input id="fav" type="checkbox" style="width:auto"> Favorite</label></div><div class="field"><label>Notes / review</label><textarea id="notes" rows="3" placeholder="What did you think?"></textarea></div><div class="buttons"><button type="submit">Save album</button><button type="button" class="secondary" id="del" hidden>Delete</button></div></form></dialog>
<script>
const $=x=>document.getElementById(x);let albums=[];try{albums=JSON.parse(localStorage.getItem('albumJournalV2')||'[]')}catch(e){}let filter='all',editing=null,selected=null;
function save(){localStorage.setItem('albumJournalV2',JSON.stringify(albums));render()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let a=[...albums];if(filter==='favorites')a=a.filter(x=>x.fav);if(filter==='recent')a.sort((x,y)=>y.created-x.created);$('count').textContent=albums.length+' album'+(albums.length===1?'':'s');$('albums').innerHTML=a.length?a.map(x=>`<div class="album" data-id="${x.id}"><div class="cover">${x.image?`<img loading="lazy" src="${esc(x.image)}">`:''}</div><div class="albumtitle">${esc(x.title)} ${x.fav?'♥':''}</div><div class="artist">${esc(x.artist)}</div>${x.rating?`<div class="rating">${'★'.repeat(Math.floor(x.rating/2))}${x.rating%2?'½':''}</div>`:''}</div>`).join(''):'<div class="empty">Your collection starts here. Search for an album above, tap a match, and save it to your journal. 🎧</div>';document.querySelectorAll('.album').forEach(el=>el.onclick=()=>open(albums.find(x=>x.id===el.dataset.id)))}
function open(x=null){editing=x?.id||null;selected=x?{...x}:null;$('dlgtitle').textContent=x?'Edit album':'Add album';$('title').value=x?.title||'';$('artist').value=x?.artist||'';$('rating').value=x?.rating||0;$('date').value=x?.date||new Date().toISOString().slice(0,10);$('fav').checked=!!x?.fav;$('notes').value=x?.notes||'';$('preview').src=x?.image||'';$('pTitle').textContent=x?.title||'Album artwork';$('pArtist').textContent=x?.artist||'';$('del').hidden=!x;$('dlg').showModal()}
async function search(){let q=$('q').value.trim();if(!q)return $('hint').textContent='Type an album or artist name first.';$('hint').textContent='Searching albums…';$('results').innerHTML='';try{let r=await fetch('https://itunes.apple.com/search?term='+encodeURIComponent(q)+'&entity=album&limit=18');let d=await r.json(),items=(d.results||[]).filter(x=>x.collectionName&&x.artistName);if(!items.length)return $('hint').textContent='No matches. Try a different spelling or artist name.';$('hint').textContent='Tap the album you want to add.';$('results').innerHTML=items.map((x,i)=>`<button class="result" data-i="${i}"><img src="${esc((x.artworkUrl100||'').replace('100x100bb','600x600bb'))}"><span><strong>${esc(x.collectionName)}</strong>${esc(x.artistName)} · ${(x.releaseDate||'').slice(0,4)}</span></button>`).join('');document.querySelectorAll('.result').forEach((el,i)=>el.onclick=()=>{let x=items[i],image=(x.artworkUrl100||'').replace('100x100bb','600x600bb'),old=albums.find(a=>a.collectionId===x.collectionId);open(old||{title:x.collectionName,artist:x.artistName,image,collectionId:x.collectionId,rating:0,fav:false,date:new Date().toISOString().slice(0,10),notes:''})})}catch(e){$('hint').textContent='Search could not connect. Check your internet and try again.'}}
$('find').onclick=search;$('q').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();search()}};$('manual').onclick=()=>open();$('close').onclick=()=>$('dlg').close();$('form').onsubmit=e=>{e.preventDefault();let old=albums.find(a=>a.id===editing),x={id:editing||('id'+Date.now()),title:$('title').value.trim(),artist:$('artist').value.trim(),image:selected?.image||old?.image||'',collectionId:selected?.collectionId||old?.collectionId||null,rating:+$('rating').value,date:$('date').value,fav:$('fav').checked,notes:$('notes').value.trim(),created:old?.created||Date.now()};albums=editing?albums.map(a=>a.id===editing?x:a):[x,...albums];save();$('dlg').close();$('results').innerHTML='';$('hint').textContent='Saved! Search for another album whenever you like.'};$('del').onclick=()=>{if(editing&&confirm('Delete this album?')){albums=albums.filter(a=>a.id!==editing);save();$('dlg').close()}};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render();
</script></body></html>
