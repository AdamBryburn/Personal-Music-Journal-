<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101016"><link rel="manifest" href="manifest.webmanifest"><title>Bryburn</title>
<style>
:root{color-scheme:dark;--bg:#101016;--panel:#191922;--panel2:#20202b;--line:#343440;--text:#f7f5fb;--muted:#a9a6b5;--accent:#c9a7ff;--accent2:#8f70cf;--good:#9ee3bd;--warn:#ffd58b;--danger:#ff9eaf}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 50% -10%,#252035 0,#101016 42%);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;padding-bottom:86px}button,input,textarea,select{font:inherit}button{border:0;border-radius:12px;padding:10px 13px;font-weight:750;background:var(--accent);color:#24182f;cursor:pointer}button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}button.ghost{background:transparent;color:var(--muted);padding:8px}button:disabled{opacity:.45;cursor:default}input,textarea,select{width:100%;background:#111118;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--accent2)}textarea{min-height:105px;resize:vertical}
.wrap{max-width:1100px;margin:auto;padding:18px 14px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:30px;font-weight:850;letter-spacing:-1px}.sub{color:var(--muted);font-size:12px}.search{position:relative;display:flex;gap:8px;margin:18px 0}.search input{min-width:0}.suggestions{position:absolute;left:0;right:72px;top:52px;z-index:50;background:#1a1a23;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 18px 50px #000b}.sug{width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:transparent;color:var(--text);border-radius:0;border-bottom:1px solid #2b2b35}.sug:last-child{border-bottom:0}.sug:hover{background:#282833}.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#30303b}.sug small{display:block;color:var(--muted);font-weight:500;margin-top:2px}
.toolbar{display:flex;gap:8px;overflow:auto;margin:8px 0 16px}.toolbar button{white-space:nowrap}.section{margin:22px 0}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}h1,h2,h3,p{margin:0}h2{font-size:19px}h3{font-size:16px}.muted{color:var(--muted)}.small{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:13px}.card{background:var(--panel);border:1px solid #292933;border-radius:15px;overflow:hidden;cursor:pointer;transition:.16s transform,.16s border-color}.card:hover{transform:translateY(-2px);border-color:#51496a}.cover{width:100%;aspect-ratio:1;display:block;object-fit:cover;background:#292934}.cardbody{padding:10px}.title{font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;margin-top:3px}.meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}.rating{color:#ffd77a;font-weight:800}.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid #3b3946;background:#24232d;border-radius:999px;padding:5px 8px;font-size:11px;color:#dcd7e7}.row{display:flex;align-items:center;gap:9px}.empty{padding:35px 18px;text-align:center;background:var(--panel);border:1px dashed var(--line);border-radius:15px;color:var(--muted)}
.artistHero{display:flex;gap:18px;align-items:center;background:linear-gradient(135deg,#211c2d,#191922);border:1px solid var(--line);padding:18px;border-radius:18px}.artistAvatar{width:92px;height:92px;border-radius:50%;object-fit:cover;background:#30303b}.artistName{font-size:26px;font-weight:850}.catalogTabs{display:flex;gap:7px;margin:15px 0}.catalogTabs button.active,.toolbar button.active{background:var(--accent);color:#24182f}.releaseGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.modal{position:fixed;inset:0;background:#000b;z-index:100;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:92vh;overflow:auto;background:#171720;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px}.modalTop{display:flex;justify-content:space-between;align-items:center;gap:12px}.albumHero{display:flex;gap:15px;margin:14px 0}.albumCover{width:150px;height:150px;object-fit:cover;border-radius:14px;background:#2a2933}.field{margin:12px 0}.stars{display:flex;gap:3px;flex-wrap:wrap}.starBtn{background:transparent;color:#5f5b67;font-size:22px;padding:4px}.starBtn.on{color:#ffd77a}.tracklist{margin-top:15px;border-top:1px solid var(--line)}.track{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:11px 0;border-bottom:1px solid #292932}.tracknum{color:var(--muted);font-size:12px}.trackTitle{font-weight:650}.trackFeat{font-size:12px;color:var(--muted)}.favSong{background:transparent;color:#6b6873;padding:4px;font-size:19px}.favSong.on{color:#ffd77a}.close{background:transparent;color:var(--muted);font-size:22px;padding:4px}
.statsYears{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.yearCard{background:var(--panel);border:1px solid var(--line);padding:14px;border-radius:14px;cursor:pointer}.yearCard strong{font-size:22px}.topAlbum{display:flex;gap:12px;align-items:center;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.topAlbum img{width:58px;height:58px;border-radius:9px;object-fit:cover}.list{display:flex;flex-direction:column;gap:8px}.listItem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;cursor:pointer}.discover{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.discoverCard{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px}.discoverCard .reason{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}.followCard{display:flex;gap:12px;align-items:center;padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:14px}.followCard img{width:55px;height:55px;border-radius:50%;object-fit:cover;background:#30303b}.releaseDate{color:var(--good);font-weight:800}.nav{position:fixed;z-index:90;bottom:0;left:0;right:0;background:#121219ed;border-top:1px solid var(--line);backdrop-filter:blur(16px);display:grid;grid-template-columns:repeat(4,1fr);padding:8px max(8px,env(safe-area-inset-left)) max(8px,env(safe-area-inset-bottom))}.nav button{background:transparent;color:var(--muted);padding:8px 4px;font-size:11px}.nav button.active{color:var(--text);background:#282531}.nav b{display:block;font-size:18px;margin-bottom:2px}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#282631;color:#fff;padding:10px 14px;border-radius:12px;z-index:200;box-shadow:0 10px 35px #0008;display:none}.toast.show{display:block}
@media(min-width:720px){.modal{align-items:center}.sheet{border-radius:22px}.albumHero{align-items:center}.nav{max-width:680px;left:50%;right:auto;transform:translateX(-50%);width:100%;border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0}}
</style></head>
<body>
<div class="wrap">
  <header class="top"><div><div class="brand">Bryburn</div><div class="sub">Your personal music history</div></div><button id="installBtn" class="secondary" style="display:none">Install</button></header>

  <section id="libraryView">
    <div class="search"><input id="search" autocomplete="off" placeholder="Search artists, albums, or EPs…"><button id="searchBtn">Search</button><div id="suggestions" class="suggestions" style="display:none"></div></div>
    <div class="toolbar"><button class="active" data-filter="all">All</button><button data-filter="favorites">Favorites</button><button data-filter="recent">Recently added</button></div>
    <div id="library" class="grid"></div>
  </section>

  <section id="statsView" style="display:none">
    <div class="sectionhead"><div><h2>Stats</h2><div class="small">Your ratings, year by year.</div></div></div>
    <div id="statsSummary" class="statsYears"></div>
    <div class="section"><div class="sectionhead"><h2>Favorite songs</h2><span class="small" id="favSongCount"></span></div><div id="favSongs" class="list"></div></div>
  </section>

  <section id="discoverView" style="display:none">
    <div class="sectionhead"><div><h2>Discovery</h2><div class="small">Find artists and releases that fit what you actually rate highly.</div></div></div>
    <div id="discover" class="discover"></div>
  </section>

  <section id="followingView" style="display:none">
    <div class="sectionhead"><div><h2>Following</h2><div class="small">Artists you've chosen to keep up with.</div></div></div>
    <div id="upcoming" class="list"></div>
    <div class="section"><div class="sectionhead"><h2>Your artists</h2></div><div id="following" class="list"></div></div>
  </section>
</div>

<nav class="nav"><button class="active" data-tab="library"><b>▦</b>Library</button><button data-tab="stats"><b>◒</b>Stats</button><button data-tab="discover"><b>✦</b>Discover</button><button data-tab="following"><b>◷</b>Following</button></nav>

<div id="modal" class="modal"><div class="sheet"><div class="modalTop"><div id="modalHeading"></div><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>
<script>
const MB='https://musicbrainz.org/ws/2';
const IT='https://itunes.apple.com/search';
const CAA='https://coverartarchive.org/release-group/';
const STORE='bryburnDataV1';
const seedTaste=['Dance Gavin Dance','Bring Me The Horizon','Ice Nine Kills','Silverstein','Senses Fail','Bad Omens','Sleep Token','The Plot In You','The Home Team','Eidola','Picturesque','Safe Bet','Spiritbox','Valiant Hearts','SYCAMOUR'];
let db=load(); let filter='all'; let currentRelease=null; let currentArtist=null; let searchTimer=null; let installPrompt=null;
function load(){try{let x=JSON.parse(localStorage.getItem(STORE)||'{}');return {albums:x.albums||[],follows:x.follows||[],awards:x.awards||{}}}catch{return {albums:[],follows:[],awards:{}}}}
function save(){localStorage.setItem(STORE,JSON.stringify(db))}
function esc(s=''){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function fmtDur(ms){if(!ms)return '';let sec=Math.round(ms/1000),m=Math.floor(sec/60),s=String(sec%60).padStart(2,'0');return m+':'+s}
function stars(n){let s='';for(let i=1;i<=10;i++)s+=`<span style="color:${i<=n?'#ffd77a':'#4e4b57'}">★</span>`;return s}
function albumKey(x){return x.mbid||((x.artist||'')+'|'+(x.title||'')).toLowerCase()}
function normalize(a){return {mbid:a.mbid||a.id,title:a.title||a.name,artist:a.artist||a['artist-credit']?.map(x=>x.name||x.artist?.name).join('')||'',artistId:a.artistId||a['artist-credit']?.[0]?.artist?.id||'',year:(a.year||a['first-release-date']||'').slice(0,4),type:(a.type||a['primary-type']||'Album'),cover:a.cover||'',tracks:a.tracks||[],rating:a.rating||0,favorite:!!a.favorite,date:a.date||'',notes:a.notes||'',favoriteSongId:a.favoriteSongId||'',followArtist:!!a.followArtist}}
function render(){let arr=[...db.albums].sort((a,b)=>(b.date||'').localeCompare(a.date||''));if(filter==='favorites')arr=arr.filter(x=>x.favorite);if(filter==='recent')arr=arr.slice(0,20);let el=document.getElementById('library');el.innerHTML=arr.length?arr.map(a=>`<article class="card" onclick="openSaved('${esc(albumKey(a))}')"><img class="cover" src="${esc(a.cover||placeholder(a.title))}" onerror="this.src='${placeholder(a.title)}'"><div class="cardbody"><div class="title">${esc(a.title)}</div><div class="artist" onclick="event.stopPropagation(); artistPage('${esc(a.artistId)}','${esc(a.artist)}')">${esc(a.artist)}</div><div class="meta"><span>${esc(a.year||'')}</span><span class="rating">${a.rating?stars(Math.round(a.rating)):'Not rated'}</span></div></div></article>`).join(''):`<div class="empty" style="grid-column:1/-1">Your library is empty. Search for an artist, album, or EP above to start building it.</div>`}
function placeholder(t){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600"><rect width="100%" height="100%" fill="#292934"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#aaa6b6" font-size="28" font-family="sans-serif">${esc((t||'Album').slice(0,18))}</text></svg>`)}
function mbFetch(path){return fetch(MB+path+'&fmt=json',{headers:{Accept:'application/json'}}).then(r=>{if(!r.ok)throw new Error('MusicBrainz '+r.status);return r.json()})}
function itunes(term){return fetch(IT+'?term='+encodeURIComponent(term)+'&entity=album&limit=25').then(r=>r.json()).then(x=>x.results||[])}
async function artistSearch(q){let data=await mbFetch('/artist/?query='+encodeURIComponent('artist:'+q)+'&limit=10');return (data.artists||[]).map(a=>({id:a.id,name:a.name,score:a.score,type:a.type,area:a.area?.name||'',tags:(a.tags||[]).map(t=>t.name)})).sort((a,b)=>artistScore(b,q)-artistScore(a,q))}
function artistScore(a,q){let s=0,n=a.name.toLowerCase(),z=q.toLowerCase();if(n===z)s+=1000;if(n.startsWith(z))s+=500;if(n.includes(z))s+=200;let seed=seedTaste.some(x=>x.toLowerCase()===n);if(seed)s+=450;let tags=(a.tags||[]).join(' ').toLowerCase();['metalcore','post-hardcore','hardcore','swancore','emo','metal','alternative metal','progressive metalcore'].forEach(k=>{if(tags.includes(k))s+=60});return s+(a.score||0)}
async function releaseSearch(q){let mb=await mbFetch('/release-group/?query='+encodeURIComponent(q)+'&limit=60');let arr=(mb['release-groups']||[]).filter(x=>['Album','EP'].includes(x['primary-type'])||['album','ep'].includes(x.type));let it=[];try{it=await itunes(q)}catch{}let byTitle=new Map();for(let x of arr){let artist=x['artist-credit']?.map(c=>c.name).join('')||'';let key=(x.title+'|'+artist).toLowerCase();byTitle.set(key,normalize({mbid:x.id,title:x.title,artist,artistId:x['artist-credit']?.[0]?.artist?.id,year:x['first-release-date'],type:x['primary-type']||'Album'}))}for(let x of it){let artist=x.artistName||'',key=(x.collectionName+'|'+artist).toLowerCase();let old=byTitle.get(key);if(old){old.cover=x.artworkUrl100?.replace('100x100','600x600')||old.cover}else byTitle.set(key,normalize({mbid:'itunes:'+x.collectionId,title:x.collectionName,artist,year:x.releaseDate,type:'Album',cover:x.artworkUrl100?.replace('100x100','600x600')}))}return [...byTitle.values()].filter(x=>x.title&&x.artist).sort((a,b)=>releaseScore(b,q)-releaseScore(a,q)).slice(0,30)}
function releaseScore(a,q){let s=0,t=(a.title||'').toLowerCase(),ar=(a.artist||'').toLowerCase(),z=q.toLowerCase();if(ar===z)s+=1000;if(ar.startsWith(z))s+=650;if(t===z)s+=800;if(t.startsWith(z))s+=300;if(seedTaste.some(x=>x.toLowerCase()===ar))s+=420;return s}
async function doSearch(){let q=document.getElementById('search').value.trim();if(!q)return;hideSug();document.getElementById('library').innerHTML='<div class="empty" style="grid-column:1/-1">Searching your music universe…</div>';try{let [artists,releases]=await Promise.all([artistSearch(q),releaseSearch(q)]);showSearchResults(q,artists,releases)}catch(e){document.getElementById('library').innerHTML='<div class="empty" style="grid-column:1/-1">Search had trouble reaching the music databases. Try again in a moment.</div>'}}
function showSearchResults(q,artists,releases){let el=document.getElementById('library');let html='';if(artists.length)html+=`<div style="grid-column:1/-1" class="section"><div class="sectionhead"><h2>Artists</h2><span class="small">${artists.length} matches</span></div><div class="list">${artists.slice(0,8).map(a=>`<div class="listItem" onclick="artistPage('${esc(a.id)}','${esc(a.name)}')"><div><b>${esc(a.name)}</b><div class="small">${esc(a.area||a.type||'Artist')}</div></div><span>›</span></div>`).join('')}</div></div>`;html+=`<div style="grid-column:1/-1" class="section"><div class="sectionhead"><h2>Albums & EPs</h2><span class="small">Singles filtered out</span></div></div>`;html+=releases.map(a=>`<article class="card" onclick='openRelease(${JSON.stringify(a).replace(/</g,'\\u003c')})'><img class="cover" src="${esc(a.cover||placeholder(a.title))}" onerror="this.src='${placeholder(a.title)}'"><div class="cardbody"><div class="title">${esc(a.title)}</div><div class="artist">${esc(a.artist)}</div><div class="meta"><span>${esc(a.year||'')}</span><span class="pill">${esc(a.type)}</span></div></div></article>`).join('');el.innerHTML=html||`<div class="empty" style="grid-column:1/-1">No albums or EPs found for “${esc(q)}”.</div>`}
async function autocomplete(){let q=document.getElementById('search').value.trim();if(q.length<2){hideSug();return}try{let a=await artistSearch(q);let s=document.getElementById('suggestions');s.innerHTML=a.slice(0,6).map(x=>`<button class="sug" onclick="artistPage('${esc(x.id)}','${esc(x.name)}');document.getElementById('search').value='${esc(x.name)}';hideSug()"><div class="avatar"></div><div><b>${esc(x.name)}</b><small>${esc(x.area||'Artist')} · ${esc(x.type||'group')}</small></div></button>`).join('');s.style.display=a.length?'block':'none'}catch{}}
function hideSug(){document.getElementById('suggestions').style.display='none'}
async function artistPage(id,name){hideSug();document.getElementById('libraryView').style.display='block';document.getElementById('statsView').style.display=document.getElementById('discoverView').style.display=document.getElementById('followingView').style.display='none';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab==='library'));document.getElementById('library').innerHTML='<div class="empty" style="grid-column:1/-1">Loading artist catalog…</div>';try{let data=await mbFetch('/release-group/?artist='+encodeURIComponent(id)+'&type=album|ep&limit=100&release-group-status=website-default');let groups=(data['release-groups']||[]).filter(x=>['Album','EP'].includes(x['primary-type'])||['album','ep'].includes(x.type));let html=`<div style="grid-column:1/-1"><div class="artistHero"><div class="artistAvatar"></div><div><div class="artistName">${esc(name)}</div><div class="muted">${groups.length} albums & EPs found</div><div style="margin-top:10px"><button onclick="toggleFollow('${esc(id)}','${esc(name)}')">${db.follows.some(f=>f.id===id)?'✓ Following':'＋ Follow artist'}</button></div></div></div><div class="catalogTabs"><button class="active" onclick="renderCatalog(this,'all',${JSON.stringify(groups).replace(/</g,'\\u003c')})">All</button><button onclick="renderCatalog(this,'album',${JSON.stringify(groups).replace(/</g,'\\u003c')})">Albums</button><button onclick="renderCatalog(this,'ep',${JSON.stringify(groups).replace(/</g,'\\u003c')})">EPs</button></div><div id="artistCatalog" class="releaseGrid"></div></div>`;document.getElementById('library').innerHTML=html;renderCatalog(document.querySelector('.catalogTabs button.active'),'all',groups)}catch(e){document.getElementById('library').innerHTML='<div class="empty" style="grid-column:1/-1">Could not load this artist catalog.</div>'}}
async function renderCatalog(btn,type,groups){document.querySelectorAll('.catalogTabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');let list=type==='all'?groups:groups.filter(x=>(x['primary-type']||x.type).toLowerCase()===type);let html='';for(let x of list){let a=normalize({mbid:x.id,title:x.title,artist:x['artist-credit']?.map(c=>c.name).join('')||'',artistId:x['artist-credit']?.[0]?.artist?.id,year:x['first-release-date'],type:x['primary-type']||x.type});let cover='';try{let ca=await fetch(CAA+x.mbid+'/front-250').then(r=>r.ok?r.url:'');cover=ca}catch{};if(!cover){try{let it=await itunes(a.artist+' '+a.title);cover=it[0]?.artworkUrl100?.replace('100x100','600x600')||''}catch{}}a.cover=cover;html+=`<article class="card" onclick='openRelease(${JSON.stringify(a).replace(/</g,'\\u003c')})'><img class="cover" src="${esc(cover||placeholder(a.title))}" onerror="this.src='${placeholder(a.title)}'"><div class="cardbody"><div class="title">${esc(a.title)}</div><div class="artist">${esc(a.artist)}</div><div class="meta"><span>${esc(a.year||'')}</span><span class="pill">${esc(a.type)}</span></div></div></article>`}document.getElementById('artistCatalog').innerHTML=html||'<div class="empty">No releases found.</div>'}
async function openRelease(a){currentRelease=normalize(a);document.getElementById('modalHeading').innerHTML=`<div><h2>${esc(currentRelease.title)}</h2><div class="small">${esc(currentRelease.artist)} · ${esc(currentRelease.type)} · ${esc(currentRelease.year||'')}</div></div>`;document.getElementById('modalBody').innerHTML='<div class="empty">Loading album details…</div>';document.getElementById('modal').classList.add('show');let saved=db.albums.find(x=>albumKey(x)===albumKey(currentRelease));if(saved)currentRelease={...currentRelease,...saved};if(!currentRelease.cover)try{currentRelease.cover=(await itunes(currentRelease.artist+' '+currentRelease.title))[0]?.artworkUrl100?.replace('100x100','600x600')||''}catch{}if(currentRelease.mbid&&!currentRelease.mbid.startsWith('itunes:'))try{let rg=await mbFetch('/release-group/'+currentRelease.mbid+'?inc=releases');let rel=(rg.releases||[]).filter(r=>r.status==='Official'||r.status==='official')[0]||rg.releases?.[0];if(rel){let full=await mbFetch('/release/'+rel.id+'?inc=recordings+artist-credits+media');let tracks=[];(full.media||[]).forEach(m=>(m.tracks||[]).forEach(t=>tracks.push({id:t.recording?.id||t.id,title:t.title||t.recording?.title||'',duration:t.length||t.recording?.length||0,number:t.number||'',artists:(t['artist-credit']||t.recording?.['artist-credit']||[]).map(c=>c.name).join('')})));currentRelease.tracks=tracks}}catch{}renderModal()}
function renderModal(){let fav=currentRelease.favoriteSongId||'';document.getElementById('modalBody').innerHTML=`<div class="albumHero"><img class="albumCover" src="${esc(currentRelease.cover||placeholder(currentRelease.title))}" onerror="this.src='${placeholder(currentRelease.title)}'"><div><div class="pill">${esc(currentRelease.type)}</div><div style="margin-top:8px" class="muted">${esc(currentRelease.artist)}</div><div style="margin-top:10px"><button class="secondary" onclick="artistPage('${esc(currentRelease.artistId)}','${esc(currentRelease.artist)}');closeModal()">View artist</button> <button class="secondary" onclick="toggleFollow('${esc(currentRelease.artistId)}','${esc(currentRelease.artist)}')">${db.follows.some(f=>f.id===currentRelease.artistId)?'✓ Following':'＋ Follow'}</button></div></div></div><div class="field"><label>Your rating</label><div class="stars">${Array.from({length:10},(_,i)=>`<button class="starBtn ${i<Math.round(currentRelease.rating||0)?'on':''}" onclick="setRating(${i+1})">★</button>`).join('')}</div><div class="small">${currentRelease.rating?currentRelease.rating+'/10':'Not rated yet'}</div></div><div class="field"><label>Listened / rated</label><input id="rdate" type="date" value="${esc(currentRelease.date||new Date().toISOString().slice(0,10))}"></div><div class="field"><label><input id="rfav" type="checkbox" style="width:auto;margin-right:8px" ${currentRelease.favorite?'checked':''}> Favorite album</label></div><div class="field"><label>Notes</label><textarea id="rnotes" placeholder="What did you think?">${esc(currentRelease.notes||'')}</textarea></div><div class="sectionhead" style="margin-top:18px"><h3>Tracklist</h3><span class="small">Favorite exactly one song</span></div><div class="tracklist">${(currentRelease.tracks||[]).map((t,i)=>`<div class="track"><div class="tracknum">${esc(t.number||String(i+1))}</div><div><div class="trackTitle">${esc(t.title)}</div>${t.artists?`<div class="trackFeat">${esc(t.artists)}</div>`:''}</div><div><span class="small">${fmtDur(t.duration)}</span><button class="favSong ${fav===t.id?'on':''}" onclick="favoriteSong('${esc(t.id)}')">★</button></div></div>`).join('')||'<div class="empty">Tracklist will appear when the music database has release details for this album.</div>'}</div><div style="display:flex;gap:8px;margin-top:18px"><button onclick="saveRelease()">Save to Bryburn</button><button class="secondary" onclick="closeModal()">Close</button></div>`}
function setRating(n){currentRelease.rating=n;renderModal()}
function favoriteSong(id){currentRelease.favoriteSongId=currentRelease.favoriteSongId===id?'':id;renderModal()}
function saveRelease(){let a=normalize(currentRelease);a.rating=currentRelease.rating||0;a.favorite=document.getElementById('rfav')?.checked||false;a.date=document.getElementById('rdate')?.value||new Date().toISOString().slice(0,10);a.notes=document.getElementById('rnotes')?.value||'';a.favoriteSongId=currentRelease.favoriteSongId||'';a.tracks=currentRelease.tracks||[];let i=db.albums.findIndex(x=>albumKey(x)===albumKey(a));if(i>=0)db.albums[i]=a;else db.albums.push(a);if(a.artistId&&!db.follows.some(f=>f.id===a.artistId)){db.follows.push({id:a.artistId,name:a.artist,added:new Date().toISOString(),cover:a.cover||''})}save();render();renderStats();renderFollowing();renderDiscover();toast('Saved to Bryburn');closeModal()}
function openSaved(k){let a=db.albums.find(x=>albumKey(x)===k);if(a)openRelease(a)}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function toggleFollow(id,name){if(!id)return toast('This artist does not have a MusicBrainz ID yet.');let i=db.follows.findIndex(f=>f.id===id);if(i>=0){db.follows.splice(i,1);toast('Artist unfollowed')}else{db.follows.push({id,name,added:new Date().toISOString(),cover:''});toast('Artist followed — Bryburn will watch for releases')}save();renderFollowing();renderDiscover();if(currentRelease)renderModal()}
function showTab(tab){['library','stats','discover','following'].forEach(x=>document.getElementById(x+'View').style.display=x===tab?'block':'none');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='stats')renderStats();if(tab==='discover')renderDiscover();if(tab==='following')renderFollowing()}
function renderStats(){let by={};db.albums.forEach(a=>{let y=a.year||'Unknown';(by[y]??=[]).push(a)});let years=Object.keys(by).filter(x=>x!=='Unknown').sort((a,b)=>b-a);document.getElementById('statsSummary').innerHTML=years.length?years.map(y=>{let arr=by[y].slice().sort((a,b)=>(b.rating||0)-(a.rating||0));let top=arr[0];return `<div class="yearCard" onclick="showYear('${esc(y)}')"><strong>${esc(y)}</strong><div class="small">${arr.length} album${arr.length===1?'':'s'}</div>${top?`<div class="rating" style="margin-top:8px">${top.rating?top.rating+'/10':'Unrated'}</div><div class="small">${esc(top.title)}</div>`:''}</div>`}).join(''):'<div class="empty" style="grid-column:1/-1">Rate some albums and your musical history will start appearing here.</div>';let fav=[];db.albums.forEach(a=>(a.tracks||[]).forEach(t=>{if(t.id===a.favoriteSongId)fav.push({a,t})}));document.getElementById('favSongCount').textContent=fav.length+' saved';document.getElementById('favSongs').innerHTML=fav.length?fav.map(x=>`<div class="listItem" onclick="openSaved('${esc(albumKey(x.a))}')"><div><b>${esc(x.t.title)}</b><div class="small">${esc(x.a.artist)} · ${esc(x.a.title)}</div></div><span>★</span></div>`).join(''):'<div class="empty">Choose one favorite song on an album and it will appear here.</div>'}
function showYear(y){let arr=db.albums.filter(a=>(a.year||'')===y).sort((a,b)=>(b.rating||0)-(a.rating||0));document.getElementById('libraryView').style.display='block';document.getElementById('statsView').style.display=document.getElementById('discoverView').style.display=document.getElementById('followingView').style.display='none';document.getElementById('library').innerHTML=`<div style="grid-column:1/-1"><div class="sectionhead"><div><h2>${esc(y)}</h2><div class="small">${arr.length} albums rated/reviewed</div></div><button class="secondary" onclick="showTab('stats')">Back to stats</button></div><div class="grid">${arr.map(a=>`<article class="card" onclick="openSaved('${esc(albumKey(a))}')"><img class="cover" src="${esc(a.cover||placeholder(a.title))}"><div class="cardbody"><div class="title">${esc(a.title)}</div><div class="artist">${esc(a.artist)}</div><div class="meta"><span>${a.rating?stars(Math.round(a.rating)):'Unrated'}</span></div></div></article>`).join('')}</div></div>`}
async function renderDiscover(){let el=document.getElementById('discover');let rated=db.albums.filter(a=>a.rating>=8);let known=new Set([...db.albums.map(a=>a.artist.toLowerCase()),...db.follows.map(f=>f.name.toLowerCase())]);let tags=['metalcore','post-hardcore','hardcore','swancore','emo'];let seedHits=seedTaste.filter(x=>!known.has(x.toLowerCase()));let candidates=[];for(let tag of tags){try{let d=await mbFetch('/artist/?query='+encodeURIComponent('tag:'+tag)+'&limit=12');for(let a of d.artists||[])if(a.type==='Group'||a.type==='group'||!a.type)candidates.push({id:a.id,name:a.name,tag,score:a.score||0})}catch{}}let seen=new Set();candidates=candidates.filter(x=>{if(known.has(x.name.toLowerCase())||seen.has(x.id))return false;seen.add(x.id);return true}).sort((a,b)=>b.score-a.score);if(seedHits.length)candidates.unshift(...seedHits.slice(0,4).map(name=>({id:'',name,tag:'From your taste profile',score:999})));el.innerHTML=candidates.slice(0,18).map(a=>`<div class="discoverCard"><h3>${esc(a.name)}</h3><div class="pill" style="margin-top:8px">${esc(a.tag)}</div><div class="reason">Fits the musical neighborhood Bryburn is learning from your library. Explore the artist and decide for yourself.</div><div style="margin-top:12px"><button class="secondary" ${a.id?'':'disabled'} onclick="artistPage('${esc(a.id)}','${esc(a.name)}')">Explore artist</button></div></div>`).join('')||'<div class="empty" style="grid-column:1/-1">Rate more music and Bryburn will have more signals to build discovery from.</div>'}
async function renderFollowing(){let el=document.getElementById('following');el.innerHTML=db.follows.length?db.follows.map(f=>`<div class="followCard"><div class="artistAvatar" style="width:55px;height:55px"></div><div style="flex:1"><b>${esc(f.name)}</b><div class="small">Following</div></div><button class="secondary" onclick="artistPage('${esc(f.id)}','${esc(f.name)}')">Catalog</button><button class="ghost" onclick="toggleFollow('${esc(f.id)}','${esc(f.name)}')">×</button></div>`).join(''):'<div class="empty">Artists you follow will live here. Saving an album automatically offers to follow its artist.</div>';let upcoming=[];let now=new Date().toISOString().slice(0,10);for(let f of db.follows.slice(0,25)){try{let d=await mbFetch('/release-group/?artist='+encodeURIComponent(f.id)+'&type=album|ep&limit=100');for(let x of d['release-groups']||[]){let date=(x['first-release-date']||'').slice(0,10);if(date&&date>=now)upcoming.push({date,title:x.title,artist:f.name,type:x['primary-type']||x.type,mbid:x.id,artistId:f.id})}}catch{}}upcoming.sort((a,b)=>a.date.localeCompare(b.date));document.getElementById('upcoming').innerHTML=upcoming.length?upcoming.slice(0,25).map(x=>`<div class="listItem"><div><b>${esc(x.title)}</b><div class="small">${esc(x.artist)} · ${esc(x.type)}</div></div><span class="releaseDate">${esc(x.date)}</span></div>`).join(''):'<div class="empty">No upcoming releases are currently recorded for your followed artists. As new release dates are entered into the music database, they will appear here.</div>'}
document.getElementById('searchBtn').onclick=doSearch;document.getElementById('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(autocomplete,280)});document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});document.addEventListener('click',e=>{if(!e.target.closest('.search'))hideSug()});document.querySelectorAll('.toolbar button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.toolbar button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;document.getElementById('installBtn').style.display='block'});document.getElementById('installBtn').onclick=async()=>{if(installPrompt){installPrompt.prompt();installPrompt=null}};
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();renderStats();renderFollowing();renderDiscover();
</script></body></html>
